name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      # Lets npm record where the package was built from.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # The tag triggered this run; it must name the version being published.
      - name: Check the tag against package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi
          echo "Publishing $version"

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test:ui

      # Nothing reaches npm without the suite that needs a real Redis, cluster included.
      - name: Install Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server

      - name: Start Redis and the cluster
        run: |
          redis-server --daemonize yes --save '' --appendonly no
          until redis-cli ping; do sleep 0.2; done
          SENTINEL_CLUSTER_DIR=/tmp/nestjs-sentinel-cluster bash test/cluster/up.sh

      - run: pnpm build

      - name: Integration suite
        run: |
          set -o pipefail
          pnpm test:integration 2>&1 | tee /tmp/run.txt
          if grep -q "skipped" /tmp/run.txt; then
            echo "::error::A suite was skipped; refusing to publish."
            exit 1
          fi

      - name: Publish
        run: pnpm publish --no-git-checks --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
